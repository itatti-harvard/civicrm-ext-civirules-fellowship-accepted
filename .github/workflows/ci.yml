name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    # Official PHP image instead of a third-party setup action: the org's
    # Actions policy only allows GitHub-owned actions.
    container: php:${{ matrix.php }}-cli

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: apt-get update -qq && apt-get install -y -qq rsync zip >/dev/null

      - name: Validate metadata files
        run: |
          php -r '$xml = simplexml_load_file("info.xml"); if (!$xml) { fwrite(STDERR, "Invalid info.xml\n"); exit(1); }'
          php -r '$json = json_decode(file_get_contents("civirules_conditions.json"), true, 512, JSON_THROW_ON_ERROR); if (!is_array($json) || $json === []) { fwrite(STDERR, "civirules_conditions.json must be a non-empty array\n"); exit(1); }'

      - name: Lint PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build package
        run: bash build/release-package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: civicrm-extension-package-php${{ matrix.php }}
          path: dist/*.zip
