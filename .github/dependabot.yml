# Dependabot version updates. Every PR is assigned to the org owner so it reaches
# their notifications; nobody has to check the repo. Security updates (PRs that fix
# a vulnerable package) are enabled for the whole organization and need nothing here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Rome
    assignees:
      - acaselli
